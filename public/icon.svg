<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Door Frame / Štok -->
  <rect x="116" y="96" width="280" height="340" rx="16" fill="none" stroke="url(#amberGrad)" stroke-width="18" filter="url(#shadow)" />
  <line x1="90" y1="436" x2="422" y2="436" stroke="url(#amberGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- Inner Door Leaf (Slightly Open Perspective) -->
  <path d="M136 114 L330 144 L330 422 L136 422 Z" fill="url(#woodGrad)" opacity="0.95" />
  
  <!-- Modern Door Panels / Lajsne -->
  <line x1="160" y1="180" x2="306" y2="200" stroke="#fef3c7" stroke-width="6" opacity="0.4" stroke-linecap="round" />
  <line x1="160" y1="230" x2="306" y2="250" stroke="#fef3c7" stroke-width="6" opacity="0.4" stroke-linecap="round" />
  <line x1="160" y1="280" x2="306" y2="300" stroke="#fef3c7" stroke-width="6" opacity="0.4" stroke-linecap="round" />
  <line x1="160" y1="330" x2="306" y2="350" stroke="#fef3c7" stroke-width="6" opacity="0.4" stroke-linecap="round" />

  <!-- Door Handle (Kvaka) -->
  <rect x="300" y="270" width="16" height="32" rx="4" fill="#ffffff" filter="url(#shadow)" />
  <circle cx="308" cy="286" r="4" fill="#0f172a" />

  <!-- Measuring Ruler Accent (Simbol merenja) -->
  <rect x="80" y="200" width="18" height="150" rx="4" fill="#38bdf8" opacity="0.9" />
  <line x1="80" y1="220" x2="90" y2="220" stroke="#0f172a" stroke-width="2.5" />
  <line x1="80" y1="240" x2="94" y2="240" stroke="#0f172a" stroke-width="2.5" />
  <line x1="80" y1="260" x2="90" y2="260" stroke="#0f172a" stroke-width="2.5" />
  <line x1="80" y1="280" x2="94" y2="280" stroke="#0f172a" stroke-width="2.5" />
  <line x1="80" y1="300" x2="90" y2="300" stroke="#0f172a" stroke-width="2.5" />
  <line x1="80" y1="320" x2="94" y2="320" stroke="#0f172a" stroke-width="2.5" />
</svg>
